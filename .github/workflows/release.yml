# Creates a GitHub release when a tag vX.Y.Z is pushed to the mirror.
#
# The monorepo's GitLab CI pushes the tag (subtree split) with a deploy key, which, unlike
# the built-in token, does trigger Actions workflows. The release uses the runner's
# GITHUB_TOKEN: no secret to manage.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
